server_tokens off;

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Inherited by every location below that sets no add_header of its own,
    # which is why caching uses `expires` instead of add_header.
    # cloudflareinsights.com is Cloudflare Web Analytics, injected at the edge.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Refreshing is server-only (refresh.sh on the host); the engine also
    # rejects it from anywhere but its own container.
    location = /api/refresh {
        return 404;
    }

    # The engine is only reachable on the compose network, never from the host.
    location /api/ {
        # The public API is read-only.
        limit_except GET {
            deny all;
        }
        # Resolve at request time so nginx starts even before the engine does.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $engine http://engine:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $engine;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Client-side routes such as /indicator/vix_level fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
